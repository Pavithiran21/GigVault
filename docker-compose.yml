# GigVault on your machine in one command:
#
#   docker compose up --build
#   docker compose exec app python -m scripts.seed_demo   # Kavya's year: 7 clients, 11 gigs, payments
#
# then open http://localhost:4000 and use "Log in as User" (password DEMO_PASSWORD below).
# MongoDB runs as a one-node replica set, as Atlas does (a payment and its gig's total are saved in a
# transaction). Set SMTP_* (e.g. a free Ethereal inbox) to see the password-reset email.

services:
  db:
    image: mongo:8
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - gigvault-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'db:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      APP_ENV: development
      MONGODB_URI: mongodb://db:27017/gigvault_demo?replicaSet=rs0
      JWT_SECRET: local-only-secret-change-me-0123456789abcdef
      FRONTEND_URL: http://localhost:4000
      DEMO_MODE: 'true'
      DEMO_PASSWORD: gigvault-demo-1
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-set-me}
      SMTP_PASS: ${SMTP_PASS:-set-me}
      SMTP_FROM: ${SMTP_FROM:-GigVault <no-reply@gigvault.test>}

volumes:
  gigvault-mongo:
